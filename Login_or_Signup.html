<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SemesterMate | All-in-One Student Study Hub | Notes, Playlists & Articles</title>
    <link rel="stylesheet" href="CSS/style.css">

</head>

<body class="login">
    <header class="header">
        <div class="header_logo">
            <img src="" alt="" class="header_logo--img">
            <p class="header_logo--app">SemesterMate</p>
        </div>
        <div class="header_navigation">
            <a href="#" class="header_navigation--link header_navigation--active">Home</a>
            <a href="#" class="header_navigation--link">Tutorials</a>
            <a href="#" class="header_navigation--link">Playlists</a>
            <a href="#" class="header_navigation--link">Notes</a>
            <a href="#" class="header_navigation--link">Articles</a>
            <a href="#" class="header_navigation--link">Contact</a>
        </div>
        <div class="header_btn">
            <a href="Login_or_Signup.html" class="header_btn--link">Login / Sign Up</a>
        </div>
    </header>

    <section class="section_login">
        <div class="section_login--container">
            <div class="section_login--container_header">
                <img src="" alt="">
                <p class="header_logo--app">SemesterMate</p>
            </div>
            <div class="section_login--container_title">
                <p class="section_login--container_title--1">Welcome back! Log in to continue.</p>
                <p class="section_login--container_title--2">Create your free account</p>
            </div>

            <div class="section_login--container_btn">
                <button class="section_login--container_btn--1">Login</button>
                <button class="section_login--container_btn--2 section_login--container_btn--active">Sign Up</button>
            </div>
            <form action="" class="section_login--container_form">
                <label for="">Full Name</label>
                <input type="text" placeholder="Your full name">
                <label for="">Username</label>
                <input type="text" placeholder="Set your username">
                <label for="">Email</label>
                <input type="email" placeholder="xyz@gmail.com">
                <label for="">Password</label>
                <div class="section_login--container_form--passwordBox">
                    <input type="password" placeholder="Enter your password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        class="eye_open eye_open--password">
                        <path
                            d="M12.015 7c4.751 0 8.063 3.012 9.504 4.636-1.401 1.837-4.713 5.364-9.504 5.364-4.42 0-7.93-3.536-9.478-5.407 1.493-1.647 4.817-4.593 9.478-4.593zm0-2c-7.569 0-12.015 6.551-12.015 6.551s4.835 7.449 12.015 7.449c7.733 0 11.985-7.449 11.985-7.449s-4.291-6.551-11.985-6.551zm-.015 3c-2.21 0-4 1.791-4 4s1.79 4 4 4c2.209 0 4-1.791 4-4s-1.791-4-4-4zm-.004 3.999c-.564.564-1.479.564-2.044 0s-.565-1.48 0-2.044c.564-.564 1.479-.564 2.044 0s.565 1.479 0 2.044z" />
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        class="eye_close eye_close--password">
                        <path
                            d="M19.604 2.562l-3.346 3.137c-1.27-.428-2.686-.699-4.243-.699-7.569 0-12.015 6.551-12.015 6.551s1.928 2.951 5.146 5.138l-2.911 2.909 1.414 1.414 17.37-17.035-1.415-1.415zm-6.016 5.779c-3.288-1.453-6.681 1.908-5.265 5.206l-1.726 1.707c-1.814-1.16-3.225-2.65-4.06-3.66 1.493-1.648 4.817-4.594 9.478-4.594.927 0 1.796.119 2.61.315l-1.037 1.026zm-2.883 7.431l5.09-4.993c1.017 3.111-2.003 6.067-5.09 4.993zm13.295-4.221s-4.252 7.449-11.985 7.449c-1.379 0-2.662-.291-3.851-.737l1.614-1.583c.715.193 1.458.32 2.237.32 4.791 0 8.104-3.527 9.504-5.364-.729-.822-1.956-1.99-3.587-2.952l1.489-1.46c2.982 1.9 4.579 4.327 4.579 4.327z"
                            / class="">
                    </svg>
                </div>
                <label for="">Confirm Password</label>
                <div class="section_login--container_form--passwordBox">
                    <input type="password" placeholder="Confirm your password">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        class="eye_open eye_open--password_confirmation">
                        <path
                            d="M12.015 7c4.751 0 8.063 3.012 9.504 4.636-1.401 1.837-4.713 5.364-9.504 5.364-4.42 0-7.93-3.536-9.478-5.407 1.493-1.647 4.817-4.593 9.478-4.593zm0-2c-7.569 0-12.015 6.551-12.015 6.551s4.835 7.449 12.015 7.449c7.733 0 11.985-7.449 11.985-7.449s-4.291-6.551-11.985-6.551zm-.015 3c-2.21 0-4 1.791-4 4s1.79 4 4 4c2.209 0 4-1.791 4-4s-1.791-4-4-4zm-.004 3.999c-.564.564-1.479.564-2.044 0s-.565-1.48 0-2.044c.564-.564 1.479-.564 2.044 0s.565 1.479 0 2.044z" />
                    </svg>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"
                        class="eye_close eye_close--password_confirmation">
                        <path
                            d="M19.604 2.562l-3.346 3.137c-1.27-.428-2.686-.699-4.243-.699-7.569 0-12.015 6.551-12.015 6.551s1.928 2.951 5.146 5.138l-2.911 2.909 1.414 1.414 17.37-17.035-1.415-1.415zm-6.016 5.779c-3.288-1.453-6.681 1.908-5.265 5.206l-1.726 1.707c-1.814-1.16-3.225-2.65-4.06-3.66 1.493-1.648 4.817-4.594 9.478-4.594.927 0 1.796.119 2.61.315l-1.037 1.026zm-2.883 7.431l5.09-4.993c1.017 3.111-2.003 6.067-5.09 4.993zm13.295-4.221s-4.252 7.449-11.985 7.449c-1.379 0-2.662-.291-3.851-.737l1.614-1.583c.715.193 1.458.32 2.237.32 4.791 0 8.104-3.527 9.504-5.364-.729-.822-1.956-1.99-3.587-2.952l1.489-1.46c2.982 1.9 4.579 4.327 4.579 4.327z" />
                    </svg>
                </div>
                <label for="">Semester</label>
                <select name="c" id="">
                    <option value="1st">1st</option>
                    <option value="2nd">2nd</option>
                    <option value="3rd">3rd</option>
                    <option value="4th">4th</option>
                    <option value="5th">5th</option>
                    <option value="6th">6th</option>
                    <option value="7th">7th</option>
                    <option value="8th">8th</option>
                </select>
            </form>
            <div class="section_login--container_submit">
                <button class="section_login--container_submit--btn submit_btn--login">Login &rarr;</button>
                <button class="section_login--container_submit--btn submit_btn--create">Crate account &rarr;</button>
            </div>
        </div>
    </section>
</body>

</html>
