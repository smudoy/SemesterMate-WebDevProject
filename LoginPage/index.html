<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <img src="LightMode.png" alt="Light Mode Switch" class="Dark-LightMode">
        <header>
            <div class="login-box">
                <button class="login-btn">
                    <img src="login_60dp_212121.png" alt="" class="LoginImg">
                    Login
                </button>
            </div>
            <div class="signup-box">
                <button class="signup-btn">
                    <img src="account_circle_60dp_212121.png" alt="" class="SignUpImg">
                    Sign Up
                </button>
            </div>
        </header>
        <main>
            <div class="email-password">
                <p class="email-para">Email adress</p>
                <input type="text" name="" id="" placeholder="Enter your email address" spellcheck="false"
                    class="email-input">
                <div class="password-box">
                    <p class="password-para">Password</p>
                    <a href="" class="forgot-Pass">Forgot password?</a>
                </div>
                <div class="password-container">
                    <input type="Password" name="" id="" placeholder="Enter your password" spellcheck="false"
                        class="password-input">
                    <img src="hide.png" alt="" class="eye-img">
                </div>
                <button class="login">Log In</button>
            </div>
            <div class="horizontal-line">
                <div class="hr-line line-1"></div>
                OR
                <div class="hr-line line-2"></div>
            </div>
            <div class="continue-cls">
                <button class="continue-btns_Google">
                    <img src="google.png" alt="">
                    Continue with Google
                </button>
                <button class="continue-btns_Apple">
                    <img src="apple_DarkMode.png" alt="">
                    Continue with Apple
                </button>
            </div>
        </main>
        <footer>
            Don't have an account yet? <a href="../SignUpPage/index.html" class="sign-up">Sign Up</a>
        </footer>
    </div>
    <script src="script.js"></script>
</body>

</html>
