<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="main-container">
        <header>
            <div class="login-box">
                <button class="login-btn">
                    <img src="login.svg" alt="">
                    Login
                </button>
            </div>
            <div class="signup-box">
                <button class="signup-btn">
                    <img src="add-user.png" alt="">
                    Sign Up
                </button>
            </div>
        </header>
        <main>
            <div class="continue-cls">
                <button>
                    <img src="google.png" alt="">
                    Continue with Google
                </button>
                <button>
                    <img src="apple.png" alt="">
                    Continue with Apple
                </button>
            </div>
            <div class="horizontal-line">
                <div class="hr-line line-1"></div>
                OR
                <div class="hr-line line-2"></div>
            </div>
            <div class="email-password">
                <p class="email-para">Email adress</p>
                <input type="text" name="" id="" placeholder="Enter your email address" spellcheck="false">
                <div class="password-box">
                    <p>Password</p>
                </div>
                <div class="password-container">
                    <input type="Password" name="" id="" placeholder="Enter your password" spellcheck="false"
                        class="password-input">
                    <img src="hide.png" alt="" class="eye-img">
                </div>
                <button class="account-create">Create an account</button>
            </div>

        </main>
        <footer>
            Already have an account? <a href="../LoginPage/index.html" class="login">Login</a>
        </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
